name: Adguard
services:
  Adguard:
    image: adguard/adguardhome:v0.107.74@sha256:f29c58a91f79387cbbbb042e140814f58e830d457d44af03d662c8df43db9dea
    container_name: Adguard
    restart: unless-stopped
    hostname: adguard
    ports:
      - 53:53/tcp
      - 53:53/udp
    networks:
      - Adguard
    volumes:
      - adguard_work:/opt/adguardhome/work
      - ${DOCKER_VOLUMES}/Adguard:/opt/adguardhome/conf

    user: "${UID}:${GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    logging:
      driver: journald
    healthcheck:
      test: netstat -tuln | grep ':53 ' > /dev/null || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
          pids: 20

# Assumes you have already created a Docker Network called 'Adguard' (ex 'docker network create Adguard'). See the README for more information.
networks:
  Adguard:
    name: Adguard
    external: true

volumes:
  adguard_work:
